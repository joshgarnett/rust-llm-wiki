name: Opt-in native qualification

# Prepared locally. Hosted execution remains external qualification, not evidence.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix-qualification:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned development toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Qualify with disposable fixtures and mock providers
        run: scripts/qualify-local.sh "$RUNNER_TEMP/lwiki-qualification"
        env:
          LWIKI_P21_EVIDENCE: ${{ runner.temp }}/lwiki-retrieval-baseline.json
      - name: Retain qualification evidence
        if: always()
        # https://github.com/actions/upload-artifact/releases/tag/v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lwiki-qualification-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/lwiki-qualification/*.log
            ${{ runner.temp }}/lwiki-qualification/*.json
            ${{ runner.temp }}/lwiki-qualification/*.txt
            ${{ runner.temp }}/lwiki-retrieval-baseline.json
          if-no-files-found: warn
          retention-days: 14

  windows-build-only:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned development toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check full Windows source and build artifact
        run: |
          cargo check --locked --offline --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --offline --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\target\release\lwiki.exe --json capabilities
          exit $LASTEXITCODE
        # Build/capabilities do not establish native Windows write/crash safety.
