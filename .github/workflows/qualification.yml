name: Opt-in native qualification

on:
  workflow_dispatch:
    inputs:
      archive-run-id:
        description: 'Existing release-build run for archived checks; leave empty to build and qualify'
        type: string
        default: ''
      source-commit:
        description: 'Full source commit of the existing release archives'
        type: string
        default: ''
      platform:
        description: 'Platform for checks against existing archives'
        type: choice
        options: [all, macos, linux]
        default: all
      checks:
        description: 'Checks to run against existing archives'
        type: choice
        options: [all, editor, installer, download, installed-smoke, unit-diagnostic]
        default: all
      compatibility-runner:
        description: 'Newer Mac runner for installed-smoke only'
        type: choice
        options: [xcode-27, macos-26]
        default: xcode-27
      diagnostic-runner:
        description: 'Runner for unit-diagnostic only'
        type: choice
        options: [xcode-27, macos-26, macos-15, ubuntu-24.04]
        default: xcode-27
      diagnostic-tests:
        description: 'Exact unit test names, one per line; unit-diagnostic only'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  unit-diagnostic:
    if: inputs.checks == 'unit-diagnostic'
    uses: ./.github/workflows/native-diagnostic.yml
    with:
      runner: ${{ inputs.diagnostic-runner }}
      tests: ${{ inputs.diagnostic-tests }}

  qualify-final-archives:
    if: inputs.archive-run-id == '' && inputs.checks != 'unit-diagnostic' && inputs.checks != 'installed-smoke'
    # Use the release pipeline so qualification never substitutes another build.
    uses: ./.github/workflows/release-build.yml

  editor:
    name: Check the archived release (${{ matrix.runner }}, ${{ inputs.checks }})
    if: (inputs.archive-run-id != '' || inputs.checks == 'installed-smoke') && inputs.checks != 'unit-diagnostic'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.checks == 'installed-smoke' && (inputs.compatibility-runner == 'xcode-27' && '[{"runner":"xcode-27","target":"aarch64-apple-darwin","macos-major":"27"}]' || '[{"runner":"macos-26","target":"aarch64-apple-darwin","macos-major":"26"}]') || inputs.platform == 'linux' && '[{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","macos-major":""}]' || (inputs.platform == 'macos' || inputs.checks == 'download') && '[{"runner":"macos-26","target":"aarch64-apple-darwin","macos-major":"26"}]' || '[{"runner":"macos-26","target":"aarch64-apple-darwin","macos-major":"26"},{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","macos-major":""}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SOURCE_RUN_ID: ${{ inputs.archive-run-id }}
      SOURCE_COMMIT: ${{ inputs.source-commit }}
      EDITOR_RUNNER: ${{ matrix.runner }}
      EDITOR_TARGET: ${{ matrix.target }}
      EDITOR_MACOS_MAJOR: ${{ matrix.macos-major }}
      REQUESTED_PLATFORM: ${{ inputs.platform }}
      REQUESTED_CHECKS: ${{ inputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.checks == 'installed-smoke' && '0' || '1' }}
      - name: Verify the archive run and record the qualification source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test -z "$(git status --porcelain)"
          mkdir "$RUNNER_TEMP/editor-inputs"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/editor-inputs/source-run.json"
          python3 - "$RUNNER_TEMP/editor-inputs/source-run.json" <<'PY'
          import json, os, pathlib, subprocess, sys
          path = pathlib.Path(sys.argv[1])
          run = json.loads(path.read_text())
          if os.environ['REQUESTED_PLATFORM'] == 'linux' and os.environ['REQUESTED_CHECKS'] in ('download', 'installed-smoke'):
              raise SystemExit('the browser and newer-Mac installed checks require macOS')
          if (run['head_sha'] != os.environ['SOURCE_COMMIT']
                  or run['repository']['full_name'] != os.environ['GITHUB_REPOSITORY']
                  or run['path'] != '.github/workflows/release-build.yml'):
              raise SystemExit('archive run does not match the expected repository, workflow and source')
          record = {'product_source_commit': run['head_sha'], 'archive_run_id': run['id'],
                    'harness_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'requested_platform': os.environ['REQUESTED_PLATFORM'],
                    'requested_checks': os.environ['REQUESTED_CHECKS'], 'runner': os.environ['EDITOR_RUNNER']}
          (path.parent / 'qualification-source.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualification-assets-${{ inputs.source-commit }}
          run-id: ${{ inputs.archive-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/editor-release-assets
      - name: Verify and extract the archived executable
        id: verified-inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts')
          import qualify_artifact as qualification
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          assets, evidence = root / 'editor-release-assets', root / 'editor-inputs'
          commit, target = os.environ['SOURCE_COMMIT'], os.environ['EDITOR_TARGET']
          version = qualification.package_version(pathlib.Path.cwd(), commit if os.environ['REQUESTED_CHECKS'] == 'installed-smoke' else None)
          major = os.environ['EDITOR_MACOS_MAJOR']
          host = qualification.host_information(target, os.environ['EDITOR_RUNNER'], int(major) if major else None)
          archive, binary, record = qualification.prepare_archive(
              assets / ('lwiki-' + version + '-' + target + '.tar.gz'),
              evidence, commit, version, target, host, assets)
          (evidence / 'artifact.json').write_text(json.dumps(record, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for key, value in {'EDITOR_BINARY': str(binary), 'EDITOR_ARCHIVE': str(archive),
                                 'EDITOR_BINARY_SHA256': record['binary_sha256'],
                                 'EDITOR_ARCHIVE_SHA256': record['archive_sha256'],
                                 'EDITOR_MANIFEST_SHA256': qualification.digest(assets / 'release-manifest.txt'),
                                 'EDITOR_INSTALLER_SHA256': qualification.digest(assets / 'install.sh')}.items():
                  env.write(key + '=' + value + '\n')
          PY
      - name: Check installed compatibility of the archived product
        if: inputs.checks == 'installed-smoke'
        run: |
          python3 scripts/qualify_artifact.py "$RUNNER_TEMP/lwiki-qualification" \
            --mode installed-smoke --product-commit "$SOURCE_COMMIT" \
            --archive "$EDITOR_ARCHIVE" --release-dir "$RUNNER_TEMP/editor-release-assets" \
            --runner-label "$EDITOR_RUNNER" --expected-macos-major "$EDITOR_MACOS_MAJOR"
      - name: Check installed PATH, reinstall and removal with the final archive
        if: inputs.checks == 'all' || inputs.checks == 'installer'
        run: |
          python3 scripts/editor-qualification/installer.py \
            --release-directory "$RUNNER_TEMP/editor-release-assets" \
            --binary-sha256 "$EDITOR_BINARY_SHA256" --source-commit "$SOURCE_COMMIT" \
            --evidence "$RUNNER_TEMP/installer-evidence"
      - name: Run the actual editor save and citation workflow
        if: ${{ !cancelled() && steps.verified-inputs.outcome == 'success' && (inputs.checks == 'all' || inputs.checks == 'editor') }}
        run: |
          python3 scripts/editor-qualification/run.py \
            --binary "$EDITOR_BINARY" --binary-sha256 "$EDITOR_BINARY_SHA256" \
            --archive "$EDITOR_ARCHIVE" --archive-sha256 "$EDITOR_ARCHIVE_SHA256" \
            --source-commit "$SOURCE_COMMIT" --evidence "$RUNNER_TEMP/editor-evidence"
      - name: Check the browser-downloaded installer with macOS protections enabled
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.verified-inputs.outcome == 'success' && (inputs.checks == 'all' || inputs.checks == 'download') }}
        run: |
          python3 scripts/download-qualification/run.py \
            --assets "$RUNNER_TEMP/editor-release-assets" \
            --archive-sha256 "$EDITOR_ARCHIVE_SHA256" --binary-sha256 "$EDITOR_BINARY_SHA256" \
            --manifest-sha256 "$EDITOR_MANIFEST_SHA256" \
            --installer-commit "$GITHUB_SHA" --installer-sha256 "$EDITOR_INSTALLER_SHA256" \
            --source-provenance "$RUNNER_TEMP/editor-inputs/qualification-source.json" \
            --evidence "$RUNNER_TEMP/download-evidence"
      - name: Retain editor qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.checks == 'installed-smoke' && 'native-evidence' || 'editor-evidence' }}-${{ matrix.runner }}-${{ inputs.source-commit }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/lwiki-qualification/*.log
            ${{ runner.temp }}/lwiki-qualification/*.json
            ${{ runner.temp }}/lwiki-qualification/*.jsonl
            ${{ runner.temp }}/lwiki-qualification/*.txt
            ${{ runner.temp }}/lwiki-qualification/*.sha256
            ${{ runner.temp }}/editor-inputs/*.json
            ${{ runner.temp }}/editor-inputs/*.sha256
            ${{ runner.temp }}/editor-evidence/*.json
            ${{ runner.temp }}/editor-evidence/*.jsonl
            ${{ runner.temp }}/editor-evidence/*.stdout
            ${{ runner.temp }}/editor-evidence/*.stderr
            ${{ runner.temp }}/editor-evidence/*.png
            ${{ runner.temp }}/editor-evidence/*.bin
            ${{ runner.temp }}/editor-evidence/*.log
            ${{ runner.temp }}/editor-evidence/*.sb
            ${{ runner.temp }}/editor-evidence/vendor-apparmor-profile
            ${{ runner.temp }}/editor-evidence/os-release
            ${{ runner.temp }}/editor-evidence/vault/**
            ${{ runner.temp }}/installer-evidence/*.json
            ${{ runner.temp }}/installer-evidence/*.stdout
            ${{ runner.temp }}/installer-evidence/*.stderr
            ${{ runner.temp }}/installer-evidence/home/My lasting wiki/**
            ${{ runner.temp }}/installer-evidence/home/My lasting note.md
            ${{ runner.temp }}/installer-evidence/home/.config/**
            ${{ runner.temp }}/download-evidence/*.json
            ${{ runner.temp }}/download-evidence/*.jsonl
            ${{ runner.temp }}/download-evidence/*.stdout
            ${{ runner.temp }}/download-evidence/*.stderr
            ${{ runner.temp }}/download-evidence/*.png
            ${{ runner.temp }}/download-evidence/downloads/install.sh
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
