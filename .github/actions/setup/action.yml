name: Set up build tools
description: Install pinned Rust, Just and Bazelisk, then fetch the locked Bazel graph.

runs:
  using: composite
  steps:
    - name: Read the pinned toolchain
      id: toolchain
      shell: bash
      run: |
        set -euo pipefail
        toolchain=$(sed -n 's/^channel = "\([0-9][0-9.]*\)"$/\1/p' rust-toolchain.toml)
        test -n "$toolchain"
        printf 'version=%s\n' "$toolchain" >> "$GITHUB_OUTPUT"
    - name: Install Rust
      shell: bash
      env:
        TOOLCHAIN: ${{ steps.toolchain.outputs.version }}
      run: rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy
    - name: Cache downloaded dependencies and Just
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/registry/src
          ~/.cargo/git/db
          ~/.cargo/bin/just
          ~/.cargo/bin/just.exe
          .build-cache/repository
        key: tools-${{ runner.os }}-${{ runner.arch }}-just1.58.0-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Cargo.lock', 'MODULE.bazel.lock', 'cargo-bazel-lock.json', '.bazelversion') }}
        restore-keys: |
          tools-${{ runner.os }}-${{ runner.arch }}-just1.58.0-${{ steps.toolchain.outputs.version }}-
    - name: Install Just
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v just >/dev/null || [[ "$(just --version)" != "just 1.58.0" ]]; then
          cargo install just --locked --version 1.58.0 --force
        fi
    - name: Install Bazelisk
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) asset=bazelisk-linux-amd64; digest=5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992 ;;
          Linux/ARM64) asset=bazelisk-linux-arm64; digest=e20e8b0f4f240091b7a55bf17b9398bd4f40ee70ae0208dff95dd4c445fb4010 ;;
          macOS/X64) asset=bazelisk-darwin-amd64; digest=16c3d7aa15323a9fb69f56c7ec5733ed18bedb786680d0ba13bb12a3c8083007 ;;
          macOS/ARM64) asset=bazelisk-darwin-arm64; digest=cee851f726789227d5561004e9904a52be45c3efb56f8b38b6993d6adbaa0409 ;;
          Windows/X64) asset=bazelisk-windows-amd64.exe; digest=092a8738d5b41aae7a85c42cc961b1034e3389aba43ffc20c0fabda7b43e095b ;;
          Windows/ARM64) asset=bazelisk-windows-arm64.exe; digest=8bc42bd5d7857f18a21440b906469bb6c7cf91a7c72364d4b1e5ec56a76fe94f ;;
          *) exit 1 ;;
        esac
        task_tools="$RUNNER_TEMP/lwiki-tools"
        task_python=python3
        task_executable=bazelisk
        if [[ "$RUNNER_OS" = Windows ]]; then task_python=python; task_executable=bazelisk.exe; fi
        mkdir -p "$task_tools"
        curl --fail --location --retry 3 "https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/$asset" --output "$task_tools/$task_executable"
        "$task_python" -c 'import hashlib, pathlib, sys; actual = hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest(); sys.exit(0 if actual == sys.argv[2] else "Bazelisk checksum mismatch")' "$task_tools/$task_executable" "$digest"
        chmod +x "$task_tools/$task_executable"
        printf '%s\n' "$task_tools" >> "$GITHUB_PATH"
    - name: Inspect installed tools
      shell: bash
      run: just doctor
    - name: Fetch locked Bazel dependencies
      shell: bash
      run: just deps-fetch
