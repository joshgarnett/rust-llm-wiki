[package]
name = "rust-llm-wiki"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "A local Markdown wiki with recoverable records and traceable evidence"

[lib]
name = "lwiki"
path = "src/lib.rs"

[[bin]]
name = "lwiki"
path = "src/main.rs"

[dependencies]
blake3 = "=1.8.5"
clap = { version = "=4.6.6", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
time = { version = "=0.3.55", features = ["formatting", "parsing", "serde"] }
uuid = { version = "=1.26.0", features = ["v7"] }
yaml-rust2 = { version = "=0.13.0", default-features = false }
pulldown-cmark = { version = "=0.13.4", default-features = false }
unicase = "=2.9.0"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "=3.27.0"
jsonschema = { version = "=0.58.2", default-features = false }
